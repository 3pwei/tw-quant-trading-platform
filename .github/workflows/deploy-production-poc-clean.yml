name: P9 PoC Clean Deploy

on:
  workflow_dispatch:
    inputs:
      platform_sha:
        description: "Exact newly P8-accepted Platform source SHA"
        required: true
        type: string
      candidate_run_id:
        description: "Exact newly P8-accepted Candidate run ID"
        required: true
        type: string
      manifest_sha256:
        description: "Exact newly P8-accepted manifest SHA256"
        required: true
        type: string
      confirmation:
        description: "DEPLOY P9 POC CLEAN production <platform_sha> candidate <candidate_run_id> manifest <manifest_sha256>"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: lightsail-production
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact clean-deploy P8 binding and master gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          P9_SOURCE: ${{ inputs.platform_sha }}
          P9_CANDIDATE: ${{ inputs.candidate_run_id }}
          P9_MANIFEST: ${{ inputs.manifest_sha256 }}
          P9_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python tools/verify_public_candidate.py
          git merge-base --is-ancestor "$P9_SOURCE" "$GITHUB_SHA"
          test -z "$(git diff --name-only "$P9_SOURCE" "$GITHUB_SHA" -- . \
            ':(exclude)deploy/production/approved-p8.json' \
            ':(exclude)public-candidate.json')"
          test "$P9_CONFIRMATION" = "DEPLOY P9 POC CLEAN production $P9_SOURCE candidate $P9_CANDIDATE manifest $P9_MANIFEST"
          P9_CONFIRMATION="DEPLOY production $P9_SOURCE candidate $P9_CANDIDATE manifest $P9_MANIFEST" \
            python deploy/production/evidence.py --source "$P9_SOURCE" --candidate "$P9_CANDIDATE" \
            --manifest "$P9_MANIFEST" --control-sha "$GITHUB_SHA" --output p9-clean-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p9-poc-clean-prehost-evidence
          path: p9-clean-evidence
          if-no-files-found: error
          retention-days: 90

  deploy:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    environment: lightsail-production
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ vars.PRODUCTION_USER }}
      STAGING_HOST_IDENTITY: ${{ vars.STAGING_HOST_IDENTITY }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      PRODUCTION_SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
      PRODUCTION_POC_APPROVED_CONFIG_SHA256_JSON: ${{ vars.PRODUCTION_POC_APPROVED_CONFIG_SHA256_JSON }}
      PUBLIC_DASHBOARD_URL: ${{ vars.PUBLIC_DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reverify exact clean-deploy evidence before host access
        env:
          P9_SOURCE: ${{ inputs.platform_sha }}
          P9_CANDIDATE: ${{ inputs.candidate_run_id }}
          P9_MANIFEST: ${{ inputs.manifest_sha256 }}
          P9_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python tools/verify_public_candidate.py
          git merge-base --is-ancestor "$P9_SOURCE" "$GITHUB_SHA"
          test -z "$(git diff --name-only "$P9_SOURCE" "$GITHUB_SHA" -- . \
            ':(exclude)deploy/production/approved-p8.json' \
            ':(exclude)public-candidate.json')"
          test "$P9_CONFIRMATION" = "DEPLOY P9 POC CLEAN production $P9_SOURCE candidate $P9_CANDIDATE manifest $P9_MANIFEST"
          P9_CONFIRMATION="DEPLOY production $P9_SOURCE candidate $P9_CANDIDATE manifest $P9_MANIFEST" \
            python deploy/production/evidence.py --source "$P9_SOURCE" --candidate "$P9_CANDIDATE" \
            --manifest "$P9_MANIFEST" --control-sha "$GITHUB_SHA" --output p9-clean-evidence
      - name: Deploy fresh PoC database with retained Legacy recovery
        id: deploy
        run: python deploy/production/poc_clean_transport.py deploy --evidence p9-clean-evidence
      - name: Capture sanitized clean-deploy evidence
        id: capture
        if: ${{ always() && steps.deploy.outcome != 'skipped' }}
        run: python deploy/production/poc_clean_transport.py capture --evidence p9-clean-evidence
      - name: Require clean deployment acceptance
        id: acceptance
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          document = json.loads(Path('p9-clean-evidence/host/acceptance-clean.json').read_text())
          assert document['acceptance'] == document['external_runner_public_gate'] == 'PASS'
          assert document['p9_status'] == 'POC_CLEAN_DEPLOY_ACCEPTED'
          assert document['real_order'] == 'disabled' and document['legacy_retained'] is True
          assert document['legacy_backup_verified']['database_count'] == 2
          assert document['fresh_database'] == {
              'sqlite_integrity': 'ok', 'users': 1,
              'disabled_admins': 1, 'unsafe_targets': 0,
          }
          PY
      - name: Recover exact retained Legacy after any first forward failure
        if: ${{ always() && (steps.deploy.outcome == 'failure' || steps.capture.outcome == 'failure' || steps.acceptance.outcome == 'failure' || cancelled()) }}
        run: |
          if test -f p9-clean-evidence/clean-deploy-attempted; then
            python deploy/production/poc_clean_transport.py recover --evidence p9-clean-evidence
            python deploy/lightsail/verify-public-origin.py --base-url "$PUBLIC_DASHBOARD_URL" \
              --attempts 1 --timeout 10 --retry-delay 0
            python deploy/production/poc_clean_transport.py capture --evidence p9-clean-evidence
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: publish_evidence
        if: always()
        with:
          name: p9-poc-clean-production-evidence
          path: |
            p9-clean-evidence/*.json
            p9-clean-evidence/host/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Recover Legacy if acceptance evidence publication fails
        if: ${{ always() && steps.publish_evidence.outcome == 'failure' }}
        run: |
          if test -f p9-clean-evidence/clean-deploy-attempted; then
            python deploy/production/poc_clean_transport.py recover --evidence p9-clean-evidence
            python deploy/lightsail/verify-public-origin.py --base-url "$PUBLIC_DASHBOARD_URL" \
              --attempts 1 --timeout 10 --retry-delay 0
            python deploy/production/poc_clean_transport.py capture --evidence p9-clean-evidence
          fi
