name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exception-policy:
    name: Vulnerability exception policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate exception deadlines
        run: |
          python deploy/security/exception_policy.py check \
            --ignore-file .trivyignore.yaml \
            --report /tmp/security-exception-report.json \
            --fail-on-expired
          python deploy/security/npm_audit_gate.py check \
            --exceptions deploy/security/npm-audit-exceptions.json \
            --lock-file dashboard/package-lock.json \
            --fail-on-expired

  python-sast:
    name: Python static security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned scanner
        run: python -m pip install "bandit==1.9.4"
      - name: Verify fail-closed gates
        env:
          TW_QUANT_SAST_INTEGRATION: "1"
        run: python -m unittest discover -s tests -p 'test_security_sast.py' -v
      - name: Scan Python runtime and tools
        run: python deploy/security/python_sast.py tw_quant tools deploy

  javascript-sast:
    name: JS/TS static security and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Verify blocking security rules
        run: npm run test:security
      - name: Scan Dashboard JS/TS without inline suppression
        run: npm run lint:security

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
          upload: true
      - name: Upload CodeQL SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Enforce CodeQL finding policy
        run: |
          python deploy/security/codeql_sarif_gate.py \
            --input codeql-results \
            --security-threshold high \
            --quality-threshold error

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python for public verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify public-only reviewed reconstruction
        run: python tools/verify_public_candidate.py
      - name: Scan without disclosing findings
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit locked Python environment
        run: |
          python -m pip install "uv==0.11.33" "pip-audit==2.9.0"
          uv lock --check
          uv export --locked --all-extras --no-dev --no-emit-project \
            --format requirements-txt --output-file /tmp/locked-requirements.txt
          pip-audit --strict --vulnerability-service osv --progress-spinner=off \
            --requirement /tmp/locked-requirements.txt

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Capture complete npm audit report
        run: npm audit --json > "${RUNNER_TEMP}/npm-audit.json" || true
      - name: Enforce exact time-bounded npm audit policy
        run: |
          python ../deploy/security/npm_audit_gate.py enforce \
            --audit-report "${RUNNER_TEMP}/npm-audit.json" \
            --exceptions ../deploy/security/npm-audit-exceptions.json \
            --lock-file package-lock.json
      - name: Retain npm audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-evidence
          path: ${{ runner.temp }}/npm-audit.json
          if-no-files-found: error
          retention-days: 14

  container:
    name: Container scan and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public source and build runtime targets
        id: runtime-build
        run: |
          python tools/verify_public_candidate.py
          docker build --target market-api --tag platform-market-api:security .
          docker build --target execution-worker --tag platform-execution-worker:security .
      - name: Scan market API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: platform-market-api:security
          trivyignores: .trivyignore.yaml
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Scan execution worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: platform-execution-worker:security
          trivyignores: .trivyignore.yaml
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Retain unfiltered vulnerability evidence
        if: always() && steps.runtime-build.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/vulnerability-evidence"
          trivy --version > "${RUNNER_TEMP}/vulnerability-evidence/scanner.txt"
          for target in market-api execution-worker; do
            docker image inspect --format '{{.Id}}' "platform-${target}:security" > "${RUNNER_TEMP}/vulnerability-evidence/${target}.image-id"
            trivy image --scanners vuln --format json --severity HIGH,CRITICAL \
              --ignore-unfixed=false --ignorefile /dev/null --exit-code 0 \
              --output "${RUNNER_TEMP}/vulnerability-evidence/${target}.json" "platform-${target}:security"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          for path in sorted((Path(os.environ['RUNNER_TEMP']) / 'vulnerability-evidence').glob('*.json')):
              report = json.loads(path.read_text())
              rows = sorted({(v['VulnerabilityID'], v['PkgName'], v['InstalledVersion'], v.get('FixedVersion', ''))
                             for result in report.get('Results', []) for v in result.get('Vulnerabilities', [])})
              print(path.name + ': ' + json.dumps(rows))
          PY
      - name: Upload unfiltered vulnerability evidence
        if: always() && steps.runtime-build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-vulnerability-evidence
          path: ${{ runner.temp }}/vulnerability-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Generate CycloneDX SBOMs
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: platform-market-api:security
          artifact-name: platform-market-api-sbom.cdx.json
          format: cyclonedx-json
      - name: Generate execution worker CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: platform-execution-worker:security
          artifact-name: platform-execution-worker-sbom.cdx.json
          format: cyclonedx-json
