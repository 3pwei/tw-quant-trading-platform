name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  p8-shioaji:
    name: P8 offline Shioaji exact-image capability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify reviewed tree and prepare public-only capability fixture
        run: |
          python tools/verify_public_candidate.py
          python -m unittest discover -s tests -p 'test_p8_shioaji_capability.py' -v
          install -d -m 700 "${RUNNER_TEMP}/shioaji-source"
          git archive HEAD | tar -x -C "${RUNNER_TEMP}/shioaji-source"
          python deploy/staging/runtime_source.py create --root "${RUNNER_TEMP}/shioaji-source" --revision "$GITHUB_SHA"
          # Empty public fixture only exercises the wheel-install boundary; no strategy or broker credentials.
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'capability-fixture.whl'
          prefix = 'p8_capability_fixture-0.0.0.dist-info/'
          with zipfile.ZipFile(path, 'w') as wheel:
              wheel.writestr('p8_capability_fixture/__init__.py', '')
              wheel.writestr(prefix + 'METADATA', 'Metadata-Version: 2.1\nName: p8-capability-fixture\nVersion: 0.0.0\n')
              wheel.writestr(prefix + 'WHEEL', 'Wheel-Version: 1.0\nGenerator: p8-public-ci\nRoot-Is-Purelib: true\nTag: py3-none-any\n')
              wheel.writestr(prefix + 'RECORD', '')
          PY
      - name: Build public-fixture Runtime A and B once and verify exact bytes offline
        run: |
          fixture_sha="$(sha256sum "${RUNNER_TEMP}/capability-fixture.whl" | cut -d ' ' -f 1)"
          for role in a b; do
            image="p8-shioaji-runtime-${role}:ci"
            DOCKER_BUILDKIT=1 docker build \
              --file deploy/staging/Dockerfile.runtime \
              --secret "id=private_provider_wheel,src=${RUNNER_TEMP}/capability-fixture.whl" \
              --build-arg "PLATFORM_SOURCE_SHA=$GITHUB_SHA" \
              --build-arg "PIPELINE_REVISION=$GITHUB_SHA" \
              --build-arg "CONFIGURATION_IDENTITY=p8-ci-${role}" \
              --build-arg CORE_WHEEL_SHA256=63645e42755068c308d66d74ded5133395dfef816360dc8106e0bbc247ee49bd \
              --build-arg PRIVATE_PROVIDER_VERSION=0.0.0 \
              --build-arg "PRIVATE_PROVIDER_WHEEL_SHA256=$fixture_sha" \
              --tag "$image" "${RUNNER_TEMP}/shioaji-source"
            python deploy/staging/shioaji_capability.py image --image "$image"
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --mount "type=bind,source=$PWD/deploy/staging/runtime_source.py,target=/app/p8_runtime_source.py,readonly" \
              "$image" python /app/p8_runtime_source.py verify --root /app --revision "$GITHUB_SHA"
          done

  p9-cutover:
    name: P9 fail-closed cutover regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact public tree and P9 identity/rollback regressions
        run: |
          python tools/verify_public_candidate.py
          python -m unittest discover -s tests -p 'test_p9*.py' -v
      - name: Validate Production Compose without build directives
        run: |
          touch /tmp/p9-market.env /tmp/p9-execution.env /tmp/p9-gateway.env
          PRODUCTION_RUNTIME_IMAGE=ghcr.io/example/runtime@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          PRODUCTION_GATEWAY_IMAGE=ghcr.io/example/gateway@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
          PRODUCTION_MARKET_ENV_FILE=/tmp/p9-market.env \
          PRODUCTION_EXECUTION_ENV_FILE=/tmp/p9-execution.env \
          PRODUCTION_GATEWAY_ENV_FILE=/tmp/p9-gateway.env \
            docker compose --file deploy/production/docker-compose.yml config --quiet
          PRODUCTION_RUNTIME_IMAGE=ghcr.io/example/runtime@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          PRODUCTION_GATEWAY_IMAGE=ghcr.io/example/gateway@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
          PRODUCTION_MARKET_ENV_FILE=/tmp/p9-market.env \
          PRODUCTION_EXECUTION_ENV_FILE=/tmp/p9-execution.env \
          PRODUCTION_GATEWAY_ENV_FILE=/tmp/p9-gateway.env \
            docker compose --file deploy/production/docker-compose.poc-clean.yml config --quiet

  p8-image-store:
    name: P8 image identity (containerd=${{ matrix.containerd }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        containerd: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public source before runtime outputs
        run: python tools/verify_public_candidate.py
      - name: Set up isolated Docker image store
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v28.5.1
          daemon-config: |
            {"features":{"containerd-snapshotter":${{ matrix.containerd }}}}
      - name: Verify config bytes across build, push, pull and container creation
        env:
          P8_CONTAINERD: ${{ matrix.containerd }}
          P8_IMAGE_STORE_INTEGRATION: "1"
        run: |
          set -euo pipefail
          docker version
          docker info --format '{{json .DriverStatus}}'
          docker run --detach --name p8-test-registry --publish 127.0.0.1:5000:5000 registry:3
          trap 'docker rm --force p8-test-container p8-test-registry >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null
          fixture="$(mktemp -d)"
          printf 'synthetic fixture\n' > "$fixture/marker"
          printf 'FROM scratch\nCOPY marker /marker\nCMD ["/marker"]\n' > "$fixture/Dockerfile"
          tag=localhost:5000/p8-fixture:one
          docker build --provenance=false --sbom=false --tag "$tag" "$fixture"
          P8_TEST_CONFIG_DIGEST="$(docker image save "$tag" | python deploy/staging/image_config_digest.py)"
          export P8_TEST_CONFIG_DIGEST
          docker push "$tag"
          P8_TEST_IMAGE_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")"
          export P8_TEST_IMAGE_REF
          # Independent registry evidence: config is not the registry manifest digest.
          registry_config="$(docker manifest inspect --insecure "$P8_TEST_IMAGE_REF" | python -c 'import json,sys; print(json.load(sys.stdin)["config"]["digest"])')"
          test "$P8_TEST_CONFIG_DIGEST" = "$registry_config"
          test "$P8_TEST_CONFIG_DIGEST" != "${P8_TEST_IMAGE_REF##*@}"
          docker image rm "$tag"
          if docker image inspect "$P8_TEST_IMAGE_REF" >/dev/null 2>&1; then docker image rm "$P8_TEST_IMAGE_REF"; fi
          if docker image inspect "$P8_TEST_IMAGE_REF" >/dev/null 2>&1; then exit 1; fi
          docker pull "$P8_TEST_IMAGE_REF"
          P8_TEST_CONTAINER="$(docker create --name p8-test-container "$P8_TEST_IMAGE_REF")"
          export P8_TEST_CONTAINER
          python -m unittest discover -s tests -p 'test_p8_image_identity.py' -v

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify public reconstruction and dependency closure
        run: python tools/verify_public_candidate.py
      - name: Install locked public dependencies
        run: |
          python -m pip install "uv==0.11.33"
          uv lock --check
          uv sync --locked --extra server --extra test --python python
      - name: Verify Core contracts and reviewed Python tests
        run: |
          uv run --locked --extra server --extra test python tools/verify_public_candidate.py --runtime
          uv run --locked --extra server --extra test python tests/public_runtime_probe.py .
          uv run --locked --extra server --extra test python -m unittest discover -s tests -v

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run behavior tests
        run: npm test

      - name: Build static dashboard
        env:
          NEXT_PUBLIC_MARKET_API_URL: http://localhost:8000
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build

  public-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source and Compose
        run: |
          python tools/verify_public_candidate.py
          docker compose config --quiet
          touch /tmp/staging-market.env /tmp/staging-execution.env /tmp/staging-gateway.env
          STAGING_RUNTIME_IMAGE=ghcr.io/example/runtime@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          STAGING_GATEWAY_IMAGE=ghcr.io/example/gateway@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
          STAGING_MARKET_ENV_FILE=/tmp/staging-market.env \
          STAGING_EXECUTION_ENV_FILE=/tmp/staging-execution.env \
          STAGING_GATEWAY_ENV_FILE=/tmp/staging-gateway.env \
          STAGING_PROVIDER_FACTORY_FILE=/tmp/staging-provider-factory \
          STAGING_INGRESS_DIRECTORY=/tmp/staging-ingress \
            docker compose --file deploy/staging/docker-compose.yml config --quiet
      - name: Build public-only runtime images
        run: |
          docker build --target market-api --tag platform-market-api:ci .
          docker build --target execution-worker --tag platform-execution-worker:ci .
      - name: Verify exact runtime source and execution generation in public images
        run: |
          python deploy/staging/runtime_source.py create --root "$PWD" --revision "$GITHUB_SHA" --output "${RUNNER_TEMP}/runtime-source.json"
          for image in platform-market-api:ci platform-execution-worker:ci; do
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --mount "type=bind,source=$PWD/deploy/staging/runtime_source.py,target=/app/p8_runtime_source.py,readonly" \
              --mount "type=bind,source=${RUNNER_TEMP}/runtime-source.json,target=/app/runtime-source.json,readonly" \
              "$image" python /app/p8_runtime_source.py verify --root /app --revision "$GITHUB_SHA"
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001 \
              --mount "type=bind,source=$PWD/tests/test_execution_security_boundary.py,target=/app/tests/test_execution_security_boundary.py,readonly" \
              "$image" python -m unittest discover -s /app/tests -p 'test_execution_security_boundary.py' -v
          done
      - name: Verify full deployment shell orchestration in a disposable container
        run: |
          docker run --rm --network none --read-only --user 0:0 --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m --tmpfs /srv:rw,exec,nosuid,nodev,size=128m \
            --mount "type=bind,source=$PWD,target=/source,readonly" --workdir /source \
            --env P8_DEPLOYMENT_CONTRACT_TEST=1 --env P8_LITERAL_STAGING_ROOT=1 \
            --entrypoint python platform-execution-worker:ci /source/tests/test_p8_deployment_flow.py -v
      - name: Verify automatic failure compensation with real Docker
        env:
          P8_RECOVERY_DOCKER_TEST: "1"
        run: python -m unittest discover -s tests -p 'test_p8_recovery_provenance.py' -v
      - name: Verify non-root TLS and missing-plugin boundaries
        run: |
          for image in platform-market-api:ci platform-execution-worker:ci; do
            test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001 \
              --mount "type=bind,source=$PWD/tests/test_openssl_runtime.py,target=/tests/test_openssl_runtime.py,readonly" \
              "$image" python /tests/test_openssl_runtime.py
            docker run --rm --network none "$image" python -c 'from tw_quant.strategy_registry import get_strategy_services; assert get_strategy_services().catalog() == []'
          done
          test -z "$(docker image inspect --format '{{range $port, $_ := .Config.ExposedPorts}}{{$port}}{{end}}' platform-execution-worker:ci)"
          docker run --rm --network none --env BROKER_PROVIDER=disabled --env LIVE_TRADING_ENABLED=false platform-execution-worker:ci python -m tw_quant.execution_service validate
      - name: Build and exercise hardened gateway and authorization boundary
        run: |
          docker build --file deploy/lightsail/Dockerfile.gateway --tag platform-gateway:ci .
          bash deploy/lightsail/test-hardened-runtime.sh
          bash deploy/lightsail/test-gateway-auth.sh
      - name: Exercise staging gateway security and route isolation
        run: |
          docker build --file deploy/staging/Dockerfile.gateway --tag platform-staging-gateway:ci .
          bash deploy/staging/smoke-gateway.sh platform-staging-gateway:ci
          container="$(docker create platform-staging-gateway:ci)"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/usr/bin/caddy" "${RUNNER_TEMP}/p8-caddy"
          CADDY_BIN="${RUNNER_TEMP}/p8-caddy" python -m unittest discover -s tests -p 'test_p8_gateway.py' -v
          CADDY_BIN="${RUNNER_TEMP}/p8-caddy" python -m unittest discover -s tests -p 'test_p9*.py' -v
          command -v systemd-socket-activate
          test -x /usr/lib/systemd/systemd-socket-proxyd
          CADDY_BIN="${RUNNER_TEMP}/p8-caddy" python -m unittest discover -s tests -p 'test_p8_ingress.py' -v
      - name: Exercise isolated staging Compose and loopback ingress
        run: |
          sudo python3 deploy/staging/smoke_compose.py \
            --runtime-a platform-market-api:ci --runtime-b platform-market-api:ci \
            --gateway platform-staging-gateway:ci --public-fixture tests/p8_compose_backend.py
