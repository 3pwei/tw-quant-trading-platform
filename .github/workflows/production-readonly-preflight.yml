name: Production READ-ONLY Preflight

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: lightsail-production
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: lightsail-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact public source before SSH material is available
        run: python tools/verify_public_candidate.py
      - name: Inspect existing Production state without host writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ vars.PRODUCTION_USER }}
          STAGING_HOST_IDENTITY: ${{ vars.STAGING_HOST_IDENTITY }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
          PRODUCTION_APPROVED_CONFIG_SHA256_JSON: ${{ vars.PRODUCTION_APPROVED_CONFIG_SHA256_JSON }}
          LEGACY_ROLLBACK_INVENTORY_SHA256: ${{ vars.LEGACY_ROLLBACK_INVENTORY_SHA256 }}
        run: python -B deploy/production/readonly_preflight.py
      - name: Publish only schema-validated sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-readonly-preflight
          path: ${{ runner.temp }}/p9-readonly-evidence.json
          if-no-files-found: error
          retention-days: 90
