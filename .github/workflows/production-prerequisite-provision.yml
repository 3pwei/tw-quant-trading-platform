name: Production Prerequisite Provision

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "PROVISION production prerequisites <exact-master-sha>"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: lightsail-production
  cancel-in-progress: false

jobs:
  provision:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: lightsail-production
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ vars.PRODUCTION_USER }}
      STAGING_HOST_IDENTITY: ${{ vars.STAGING_HOST_IDENTITY }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      PRODUCTION_SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
      PRODUCTION_PROVISION_CONFIRMATION: ${{ inputs.confirmation }}
      PRODUCTION_MARKET_ENV_B64: ${{ secrets.PRODUCTION_MARKET_ENV_B64 }}
      PRODUCTION_EXECUTION_ENV_B64: ${{ secrets.PRODUCTION_EXECUTION_ENV_B64 }}
      PRODUCTION_GATEWAY_ENV_B64: ${{ secrets.PRODUCTION_GATEWAY_ENV_B64 }}
      PRODUCTION_PROVIDER_FACTORY_B64: ${{ secrets.PRODUCTION_PROVIDER_FACTORY_B64 }}
      PRODUCTION_REPLAY_CSV_B64: ${{ secrets.PRODUCTION_REPLAY_CSV_B64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed public tree before Production access
        run: python tools/verify_public_candidate.py
      - name: Provision isolated Production prerequisites
        run: python -B deploy/production/provision_prerequisites.py --runner
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: production-prerequisite-provision
          path: ${{ runner.temp }}/production-prerequisite-provision.json
          if-no-files-found: error
          retention-days: 90
