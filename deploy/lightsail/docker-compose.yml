name: platform-production

x-runtime-security: &runtime-security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  market-api:
    <<: *runtime-security
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: Dockerfile
      target: market-api
      args:
        DEPLOY_COMMIT_SHA: ${DEPLOY_COMMIT_SHA:-unknown}
    user: "10001:10001"
    env_file:
      - ${MARKET_ENV_FILE:-market.env}
    expose:
      - "8000"
    volumes:
      - market-data:/data
      # Cached operational state only; no credentials or broker SDK access.
      - execution-health:/run/tw-quant-execution:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770
    cpus: "1.00"
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  execution-worker:
    <<: *runtime-security
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: Dockerfile
      target: execution-worker
      args:
        DEPLOY_COMMIT_SHA: ${DEPLOY_COMMIT_SHA:-unknown}
    user: "10001:10001"
    env_file:
      - ${EXECUTION_ENV_FILE:-/srv/trading-platform/config/execution.env}
    volumes:
      - market-data:/data
      - ${EXECUTION_SECRETS_DIR:-/srv/trading-platform/secrets}:/run/live-secrets:ro
      - execution-health:/run/tw-quant-execution
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770
    networks:
      - execution-egress
    cpus: "1.00"
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "tw_quant.execution_service", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  gateway:
    <<: *runtime-security
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deploy/lightsail/Dockerfile.gateway
    user: "10000:10000"
    cap_add:
      - NET_BIND_SERVICE
    env_file:
      - ${GATEWAY_ENV_FILE:-gateway.env}
    depends_on:
      market-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10000,gid=10000,mode=1770
    cpus: "0.50"
    mem_limit: 256m
    restart: unless-stopped

volumes:
  market-data:
  caddy-data:
  caddy-config:
  execution-health:

networks:
  # Dedicated network: outbound broker TLS is allowed, but no public port and
  # no network is shared with gateway or market-api.
  execution-egress:
