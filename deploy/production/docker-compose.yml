{
  "name": "platform-p9-production",
  "x-runtime-security": {
    "read_only": true,
    "cap_drop": [
      "ALL"
    ],
    "security_opt": [
      "no-new-privileges:true"
    ],
    "pids_limit": 256,
    "logging": {
      "driver": "json-file",
      "options": {
        "max-size": "10m",
        "max-file": "3"
      }
    }
  },
  "services": {
    "market-api": {
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 256,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "image": "${PRODUCTION_RUNTIME_IMAGE:?exact runtime image digest is required}",
      "pull_policy": "never",
      "user": "10001:10001",
      "command": [
        "uvicorn",
        "staging_composition:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ],
      "env_file": [
        "${PRODUCTION_MARKET_ENV_FILE:?staging market config is required}"
      ],
      "expose": [
        "8000"
      ],
      "volumes": [
        "/srv/trading-platform-p9/data:/data",
        "/srv/trading-platform-p9/health:/run/tw-quant-execution:ro",
        "/srv/trading-platform-p9/provider/factory:/run/staging-provider/factory:ro"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770"
      ],
      "networks": [
        "production-api"
      ],
      "cpus": "1.00",
      "mem_limit": "768m",
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 4,
        "start_period": "30s"
      }
    },
    "execution-worker": {
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 256,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "image": "${PRODUCTION_RUNTIME_IMAGE:?exact runtime image digest is required}",
      "pull_policy": "never",
      "user": "10001:10001",
      "command": [
        "python",
        "-m",
        "tw_quant.execution_service",
        "run"
      ],
      "env_file": [
        "${PRODUCTION_EXECUTION_ENV_FILE:?staging execution config is required}"
      ],
      "volumes": [
        "/srv/trading-platform-p9/data:/data",
        "/srv/trading-platform-p9/health:/run/tw-quant-execution"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770"
      ],
      "network_mode": "none",
      "cpus": "1.00",
      "mem_limit": "768m",
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-m",
          "tw_quant.execution_service",
          "healthcheck"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 4,
        "start_period": "10s"
      }
    },
    "gateway": {
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 256,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "image": "${PRODUCTION_GATEWAY_IMAGE:?exact gateway image digest is required}",
      "pull_policy": "never",
      "user": "10000:10000",
      "env_file": [
        "${PRODUCTION_GATEWAY_ENV_FILE:?staging gateway config is required}"
      ],
      "depends_on": {
        "market-api": {
          "condition": "service_healthy"
        }
      },
      "volumes": [
        "/srv/trading-platform-p9/gateway-data:/data",
        "/srv/trading-platform-p9/gateway-config:/config",
        "/srv/trading-platform-p9/bundle/Caddyfile:/etc/caddy/Caddyfile:ro"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,nodev,size=32m,uid=10000,gid=10000,mode=1770"
      ],
      "networks": [
        "production-api"
      ],
      "cpus": "0.50",
      "mem_limit": "256m",
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "response=$$(curl --fail --silent --show-error --max-time 3 --write-out '%{http_code}' http://127.0.0.1:8080/healthz) && [ \"$$response\" = ok200 ]"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 4,
        "start_period": "10s"
      },
      "cap_add": [
        "NET_BIND_SERVICE"
      ],
      "ports": [
        "80:80",
        "443:443",
        "443:443/udp"
      ]
    }
  },
  "networks": {
    "production-api": {}
  }
}
