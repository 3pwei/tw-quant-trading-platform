name: platform-staging

x-runtime-security: &runtime-security
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  market-api:
    <<: *runtime-security
    image: ${STAGING_RUNTIME_IMAGE:?exact runtime image digest is required}
    pull_policy: never
    user: "10001:10001"
    command: ["uvicorn", "staging_composition:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ["${STAGING_MARKET_ENV_FILE:?staging market config is required}"]
    expose: ["8000"]
    volumes:
      - staging-data:/data
      - execution-health:/run/tw-quant-execution:ro
      - "${STAGING_PROVIDER_FACTORY_FILE:?provider factory file is required}:/run/staging-provider/factory:ro"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770
    networks: [staging-internal]
    cpus: "1.00"
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  execution-worker:
    <<: *runtime-security
    image: ${STAGING_RUNTIME_IMAGE:?exact runtime image digest is required}
    pull_policy: never
    user: "10001:10001"
    command: ["python", "-m", "tw_quant.execution_service", "run"]
    env_file: ["${STAGING_EXECUTION_ENV_FILE:?staging execution config is required}"]
    volumes:
      - staging-data:/data
      - execution-health:/run/tw-quant-execution
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770
    network_mode: none
    cpus: "1.00"
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "tw_quant.execution_service", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  gateway:
    <<: *runtime-security
    image: ${STAGING_GATEWAY_IMAGE:?exact gateway image digest is required}
    pull_policy: never
    user: "10000:10000"
    env_file: ["${STAGING_GATEWAY_ENV_FILE:?staging gateway config is required}"]
    depends_on:
      market-api:
        condition: service_healthy
    environment:
      STAGING_GATEWAY_SOCKET_BIND: "unix//run/staging-ingress/gateway.sock|0600"
    volumes:
      - gateway-data:/data
      - gateway-config:/config
      - "${STAGING_INGRESS_DIRECTORY:?staging ingress directory is required}:/run/staging-ingress"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10000,gid=10000,mode=1770
    networks: [staging-internal]
    cpus: "0.50"
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "response=$$(curl --fail --silent --show-error --max-time 3 --write-out '%{http_code}' http://127.0.0.1:8080/healthz) && [ \"$$response\" = ok200 ]"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

volumes:
  staging-data:
  execution-health:
  gateway-data:
  gateway-config:

networks:
  staging-internal:
    internal: true
